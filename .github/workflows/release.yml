name: Release
on:
  push:
    tags: ['v*']
permissions:
  actions: read
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check.py
      - name: Verify release identity and main ancestry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python -c 'import json,os; assert os.environ["TAG"] == "v" + json.load(open(".codex-plugin/plugin.json"))["version"]'
          git merge-base --is-ancestor HEAD origin/main
      - name: Find successful main validation for this commit
        id: validation
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: python scripts/release_validation.py --repository "$REPOSITORY" --head "$(git rev-parse HEAD)"
      - if: steps.validation.outputs.reuse != 'true'
        run: python -m pip install pytest pytest-subtests pytest-xdist
      - if: steps.validation.outputs.reuse != 'true'
        run: python scripts/test.py --workers 2
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --generate-notes
