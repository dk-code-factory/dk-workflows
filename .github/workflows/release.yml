name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pytest pytest-subtests
      - run: python scripts/check.py
      - run: python scripts/test.py
      - name: Verify release identity and main ancestry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python -c 'import json,os; assert os.environ["TAG"] == "v" + json.load(open(".codex-plugin/plugin.json"))["version"]'
          git merge-base --is-ancestor HEAD origin/main
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --generate-notes
