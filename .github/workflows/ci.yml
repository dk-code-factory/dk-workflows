name: Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pytest-subtests
      - run: python scripts/check.py
      - name: Resolve pinned PR skills test dependency
        id: dependency
        run: python -c 'import json; print("revision=" + json.load(open("test-dependencies.json"))["pr_skills"]["revision"])' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: dk-code-factory/dk-pr-skills
          ref: ${{ steps.dependency.outputs.revision }}
          path: .dependencies/dk-pr-skills
      - run: python scripts/test.py --pr-skills-root .dependencies/dk-pr-skills
      - name: Require a release version for skill and runtime changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check.py --base "$BASE_SHA"
